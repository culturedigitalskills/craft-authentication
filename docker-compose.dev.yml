services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        env_file:
            - .env.local
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - postgres_data_dev:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 10s
            timeout: 5s
            retries: 5

    garage:
        image: dxflrs/garage:v2.1.0
        restart: unless-stopped
        env_file:
            - .env.local
        environment:
            GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
        command: /garage server
        ports:
            - '${S3_PORT:-3900}:3900'
            - '${GARAGE_ADMIN_PORT:-3903}:3903'
        volumes:
            - ./garage.toml:/etc/garage.toml:ro
            - garage_data_dev:/data
            - garage_meta_dev:/meta
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3903/health']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

# Temporary Hyper-V workaround: named volumes live inside Docker's Linux VM
# and support proper Unix permissions. Revert to bind mounts under ./data-dev/
# before committing for the rest of the team.
volumes:
    postgres_data_dev:
    garage_data_dev:
    garage_meta_dev:
